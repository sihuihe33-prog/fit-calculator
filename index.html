<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // 旧版首页就是公差计算器：带 #d=…&fit=… 的旧分享链接直接跳到新地址
  if (/(^#|&)(d|fit)=/.test(location.hash)) location.replace('fit.html' + location.hash);
</script>
<title>Mechanical Design Toolbox — Fits, Bolt Torque, Gears, Shafts, Bearings, Keys</title>
<meta name="description" content="Free mechanical design calculators: ISO 286 fits and tolerances, bolt tightening torque (VDI 2230), spur gear geometry, shaft strength, bearing life, parallel keys and engineering unit conversion.">
<meta property="og:type" content="website">
<meta property="og:title" content="Mechanical Design Toolbox">
<meta property="og:description" content="Fits and tolerances, bolt torque, gears, shafts, bearings, keys and unit conversion. Fast, free, runs in your browser.">
<meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161c" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script>
  // 中文用户：在首次绘制前先隐藏页面，等脚本把文字换成中文后再显示，避免先闪一下英文
  (function () {
    var l = null;
    try { l = localStorage.getItem('fitcalc-lang'); } catch (e) {}
    if (!l) l = (navigator.language || '').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
    if (l === 'zh') {
      var h = document.documentElement;
      h.classList.add('i18n-pending');
      setTimeout(function () { h.classList.remove('i18n-pending'); }, 1500);
    }
  })();
</script>
<script type="module" src="home.js"></script>
</head>
<body data-tool="home">
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><use href="favicon.svg#g"/></svg>
      <div>
        <h1 data-i18n="h1">Mechanical Design Toolbox</h1>
        <p class="sub" data-i18n="subtitle">Everyday machine design calculations</p>
      </div>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-en" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" id="lang-zh" data-lang="zh" aria-pressed="false">中文</button>
    </div>
  </header>

  <nav class="nav" id="site-nav" aria-label="Tools"></nav>

  <main>
    <ul class="tool-grid" id="tool-grid"></ul>
    <p class="note" data-i18n="note">All calculations run locally in your browser. Values follow the cited standards and textbook methods — verify critical designs against the original sources.</p>
  </main>

  <footer class="foot">
    <span data-i18n="footerText">Open source, runs entirely in your browser.</span>
    <a href="https://github.com/sihuihe33-prog/fit-calculator" target="_blank" rel="noopener">GitHub</a>
  </footer>
</div>
</body>
</html>
